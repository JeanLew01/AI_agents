[pytest]
testpaths = tests/code
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# The login shell on this machine sources ROS 2 Jazzy, whose PYTHONPATH exposes Python 3.12 pytest
# plugins (pytest11 entry points) that the project interpreter (3.11) cannot import. Run tests with
# `env -u PYTHONPATH` (heavy.sh removes it); these flags block the plugins by name as a safety net.
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_flake8 -p no:ament_copyright -p no:ament_pep257 -p no:ament_xmllint -p no:ament_lint
