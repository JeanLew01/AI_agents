[pytest]
# Project test configuration for the gpc Paper2MCP conversion (interpreter: gpc-env/bin/python).
# Run from the project root:  env -u PYTHONPATH gpc-env/bin/python -m pytest tests/code/
# Tool tests that import jax/mujoco/gpc are heavy jobs: start them only through mcp-build/heavy.sh.
testpaths = tests/code
# Never collect the upstream checkout, the environment or scratch areas implicitly.
norecursedirs = repo gpc-env tmp notebooks src dist .pipeline .git __pycache__
# FastMCP client tests are async (pytest-asyncio 1.3.0).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
